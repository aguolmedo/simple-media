[package]
name = "simple-media"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
encoding_rs = "0.8.42"
flate2 = "1.1.10"
futures = "0.3.34"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
librqbit = { version = "9.0.1", features = ["http-api", "tracing-subscriber-utils"] }
librqbit-dualstack-sockets = "0.7"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
unicode-normalization = "0.1.26"
urlencoding = "2.1.3"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
